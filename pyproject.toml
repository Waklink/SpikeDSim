[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spikedsim"
version = "0.1.0"
description = "Simulador en Python de redes neuronales de disparo basado en modelos neuronales."
authors = [{name = "Waklink"}]

requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "matplotlib>=3.10.9",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.0",
    "tqdm>=4.68.4"
]

[tool.setuptools.packages.find]
where = ["src"]
