[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simulador-izhikevich"
version = "0.1.0"
description = "Implementación en Python de un simulador basado en el modelo neuronal de Izhikevich."
authors = [{name = "Catalin Antonio Dinu"}]

requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "matplotlib>=3.10.9",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.0",
    "tqdm>=4.68.4"
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1"
]

gpu = [
    "cupy-cuda12x==14.1.1"
]

[tool.setuptools.packages.find]
where = ["."]